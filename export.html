<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>LUNARU Capture · Export</title><style>:root{--b:#05090d;--p:#0f1821;--l:#294052;--t:#f4f7fa;--m:#a9b7c3;--a:#49b8ff;--g:#59e39a}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}main{max-width:620px;margin:auto;padding:18px}.head{display:flex;gap:10px;align-items:center;margin-bottom:18px}.logo{width:38px;height:38px;border-radius:11px;background:var(--a);color:#031018;display:grid;place-items:center;font-weight:900}.muted{color:var(--m);font-size:13px}.card{background:var(--p);border:1px solid var(--l);border-radius:16px;padding:14px;margin:10px 0}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.name{font-weight:800}.count{color:var(--g);font-weight:800}.btn{width:100%;margin-top:10px;padding:13px;border:0;border-radius:12px;background:var(--a);color:#031018;font-weight:900;font-size:15px}.btn:disabled{opacity:.45}.status{margin-top:14px;padding:12px;border:1px solid var(--l);border-radius:12px;color:var(--m);min-height:44px;white-space:pre-wrap}.topbtn{display:inline-block;padding:9px 11px;border:1px solid var(--l);border-radius:10px;color:#fff;text-decoration:none;background:#14222d}</style><script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script></head><body><main><div class="head"><div class="logo">L</div><div><b>LUNARU Capture</b><div class="muted">Экспорт отснятых станций</div></div></div><a class="topbtn" href="./">← Вернуться в Capture</a><div id="list"></div><div id="status" class="status">Ищу сохранённые кадры…</div></main><script>"use strict";const DB='lunaru_capture_media_v1',STORE='frames',list=document.getElementById('list'),statusEl=document.getElementById('status');function pad(n){return String(n).padStart(2,'0')}function safe(s){return String(s||'LUNARU').replace(/[\\/:*?\"<>|]+/g,'_').replace(/\s+/g,'_').slice(0,80)}function openDb(){return new Promise((res,rej)=>{const q=indexedDB.open(DB,1);q.onupgradeneeded=()=>{if(!q.result.objectStoreNames.contains(STORE))q.result.createObjectStore(STORE)};q.onerror=()=>rej(q.error);q.onsuccess=()=>res(q.result)})}async function readAll(){const db=await openDb();return new Promise((res,rej)=>{const tx=db.transaction(STORE,'readonly'),st=tx.objectStore(STORE),out=[];const q=st.openCursor();q.onsuccess=e=>{const c=e.target.result;if(c){out.push({key:c.key,value:c.value});c.continue()}else{db.close();res(out)}};q.onerror=()=>{db.close();rej(q.error)}})}function group(rows){const m=new Map();for(const r of rows){const v=r.value||{},obj=v.objectName||String(r.key).split('__S')[0]||'Объект',st=Number(v.station||((String(r.key).match(/__S(\d+)/)||[])[1])||0),fr=Number(v.frame||((String(r.key).match(/__(\d+)$/)||[])[1])||0),id=obj+'__S'+st;if(!m.has(id))m.set(id,{id,obj,station:st,rows:[]});m.get(id).rows.push({...r,frame:fr})}for(const g of m.values())g.rows.sort((a,b)=>a.frame-b.frame);return [...m.values()].sort((a,b)=>a.obj.localeCompare(b.obj,'ru')||a.station-b.station)}async function exportZip(g,btn){if(typeof JSZip==='undefined'){statusEl.textContent='Не загрузилась библиотека ZIP. Проверьте интернет и обновите страницу.';return}btn.disabled=true;statusEl.textContent=`Готовлю ZIP: ${g.obj}, станция ${pad(g.station)}…`;try{const zip=new JSZip(),folder=zip.folder(`Station_${pad(g.station)}`),manifest={schema:'lunaru-capture-station-v1',objectName:g.obj,station:g.station,frames:[]};let n=0;for(const r of g.rows){const v=r.value||{},blob=v.blob;if(!(blob instanceof Blob))continue;n++;const fname=`frame_${pad(r.frame||n)}.jpg`;folder.file(fname,blob);const meta={key:String(r.key),frame:r.frame||n,target:v.target||null,angles:v.angles||null,auto:v.auto??null,savedAt:v.savedAt||null,size:blob.size,type:blob.type};manifest.frames.push(meta);statusEl.textContent=`Добавляю кадры: ${n}/${g.rows.length}`;await new Promise(requestAnimationFrame)}folder.file('manifest.json',JSON.stringify(manifest,null,2));const out=await zip.generateAsync({type:'blob',compression:'DEFLATE',compressionOptions:{level:4}},m=>{statusEl.textContent=`Упаковка ZIP: ${Math.round(m.percent)}%`});const a=document.createElement('a');a.href=URL.createObjectURL(out);a.download=`LUNARU_${safe(g.obj)}_S${pad(g.station)}_${n}frames.zip`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},30000);statusEl.textContent=`Готово ✓\nСкачано ${n} JPEG. Пришлите ZIP в чат для сшивки панорамы.`}catch(e){statusEl.textContent='Ошибка экспорта: '+(e?.message||e)}finally{btn.disabled=false}}async function init(){try{const rows=await readAll(),groups=group(rows);list.innerHTML='';if(!groups.length){statusEl.textContent='Сохранённых кадров не найдено на этом устройстве/в этом браузере.';return}for(const g of groups){const d=document.createElement('div');d.className='card';d.innerHTML=`<div class="row"><div><div class="name">${g.obj}</div><div class="muted">Станция ${pad(g.station)}</div></div><div class="count">${g.rows.length} кадр.</div></div><button class="btn">СКАЧАТЬ СТАНЦИЮ ZIP</button>`;const b=d.querySelector('button');b.onclick=()=>exportZip(g,b);list.appendChild(d)}statusEl.textContent=`Найдено станций: ${groups.length}. Выберите нужную и скачайте ZIP.`}catch(e){statusEl.textContent='Ошибка чтения IndexedDB: '+(e?.message||e)}}init();</script></body></html>
