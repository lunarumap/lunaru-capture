<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>LUNARU Capture</title><style>:root{--b:#05090d;--p:#0f1821;--l:#294052;--t:#f4f7fa;--m:#a9b7c3;--a:#49b8ff;--g:#59e39a;--w:#ffd166}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--b);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}button,input{font:inherit}#app{height:100%;display:grid;grid-template-rows:auto 1fr auto}header{display:flex;gap:10px;align-items:center;padding:11px 13px;background:#0b1218;border-bottom:1px solid #1d2c37}.logo{width:36px;height:36px;border-radius:10px;background:var(--a);color:#031018;display:grid;place-items:center;font-weight:900}.brand b{display:block}.brand span{display:block;color:var(--m);font-size:11px}main{position:relative;min-height:0;background:#000}video{width:100%;height:100%;object-fit:cover}.screen{position:absolute;inset:0;display:none;place-items:center;padding:18px;background:linear-gradient(180deg,#08111a,#0c1822)}.screen.on{display:grid}.card{width:min(500px,100%);background:var(--p);border:1px solid var(--l);border-radius:18px;padding:18px}.card h1,.card h2{margin:0 0 10px}.card p{color:var(--m);font-size:13px}.field{margin:10px 0}.field label{display:block;color:var(--m);font-size:11px;margin-bottom:5px}.field input{width:100%;padding:12px;border-radius:11px;border:1px solid var(--l);background:#0b141d;color:#fff}.btn{width:100%;padding:13px;border-radius:12px;border:0;background:var(--a);color:#031018;font-weight:900;margin-top:9px}.alt{background:#14222d;color:#fff;border:1px solid var(--l)}.mode{width:100%;text-align:left;padding:12px;border-radius:12px;border:1px solid var(--l);background:#13212d;color:#fff;margin-top:8px}.mode.sel{outline:2px solid var(--a)}.mode span{display:block;color:var(--m);font-size:11px;margin-top:3px}#capture{display:none;position:absolute;inset:0;pointer-events:none}#capture.on{display:block}.top{position:absolute;top:12px;left:12px;right:12px;display:grid;grid-template-columns:1fr auto 1fr;gap:8px}.pill{background:rgba(7,12,17,.84);border:1px solid #33516a;border-radius:10px;padding:8px 10px;font-size:12px}.center{text-align:center}.right{text-align:right}.target{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:145px;height:145px;border:4px solid #fff;border-radius:50%;transition:border-color .1s,box-shadow .1s}.target.good{border-color:var(--g);box-shadow:0 0 0 7px rgba(89,227,154,.22)}#arrow{position:absolute;left:50%;top:37%;transform:translate(-50%,-50%);font-size:58px;font-weight:900;text-shadow:0 2px 10px #000}.guide{position:absolute;left:12px;right:12px;bottom:18px;background:rgba(7,12,17,.86);border:1px solid #33516a;border-radius:14px;padding:11px;text-align:center}.guide b{font-size:18px}.guide span{display:block;color:var(--m);font-size:12px;margin-top:4px}footer{padding:9px 10px calc(9px + env(safe-area-inset-bottom));background:#0b1218;border-top:1px solid #1d2c37}.actions{display:none;grid-template-columns:1fr 1fr;gap:7px}.actions.on{display:grid}.actions button{padding:10px 7px;border-radius:10px;border:1px solid #2c4357;background:#152431;color:#fff;font-weight:800}.status{font-size:11px;color:var(--m);text-align:center;margin-top:6px;min-height:14px}.status.warn{color:var(--w)}#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}#flash.f{animation:f .2s}@keyframes f{30%{opacity:.8}100%{opacity:0}}</style></head><body><div id="app"><header><div class="logo">L</div><div class="brand"><b>LUNARU Capture</b><span>Съёмка панорамы 360° · full-resolution still v4</span></div></header><main><video id="v" playsinline autoplay muted></video><canvas id="c" hidden></canvas><section id="home" class="screen on"><div class="card"><h1>LUNARU Capture</h1><p>Объект → станция → 32 кадра → следующая станция.</p><button id="new" class="btn">НОВЫЙ ОБЪЕКТ</button></div></section><section id="obj" class="screen"><div class="card"><h2>Новый объект</h2><div class="field"><label>Название объекта</label><input id="objName" placeholder="Можно оставить пустым"></div><button class="mode" data-mode="outdoor-gps"><b>Улица · GPS</b><span>Координаты сохраняются при наличии</span></button><button class="mode" data-mode="outdoor-no-gps"><b>Улица · без GPS</b><span>Координаты не обязательны</span></button><button class="mode" data-mode="indoor"><b>Помещение</b><span>GPS не требуется</span></button><button id="create" class="btn" disabled>НАЧАТЬ ОБЪЕКТ</button><button id="back" class="btn alt">НАЗАД</button></div></section><section id="station" class="screen"><div class="card"><h2 id="stTitle">Станция 01</h2><p id="stObj"></p><div class="field"><label>Название станции</label><input id="stName" placeholder="Например: Кухня"></div><p id="compat">Проверка камеры…</p><button id="start" class="btn">НАЧАТЬ СЪЁМКУ</button><button id="finishObj" class="btn alt">ЗАВЕРШИТЬ ОБЪЕКТ</button></div></section><div id="capture"><div class="top"><div id="op" class="pill">Объект</div><div id="sp" class="pill center">Станция 01</div><div id="count" class="pill right">0 / 32</div></div><div id="target" class="target"></div><div id="arrow"></div><div class="guide"><b id="g1">Наведите телефон</b><span id="g2">Цель автоматически «прилипнет» возле нужного направления</span></div></div><div id="flash"></div></main><footer><div id="actions" class="actions"><button id="retake">Переснять</button><button id="manual">Снять вручную</button><button id="finishSt">Завершить станцию</button><button id="modeBtn">Режим</button></div><div id="status" class="status">Готово</div></footer></div><script>"use strict";const $=x=>document.getElementById(x),KEY='lunaru_capture_https_v4';const IS_ANDROID=/Android/i.test(navigator.userAgent),AUTO_HOLD_MS=IS_ANDROID?700:350;let s=JSON.parse(localStorage.getItem(KEY)||'null')||{station:1,objectName:'',mode:'',current:0};let stream=null,track=null,photoCapture=null,photoCaps=null,started=false,baseYaw=null,latched=false,latchAt=0,last={yaw:0,pitch:0},smoothYaw=null,smoothPitch=null,shooting=false;const T=[];for(let i=0;i<12;i++)T.push({yaw:i*30,pitch:0,label:`Горизонт ${i+1}/12`});for(let i=0;i<8;i++)T.push({yaw:i*45,pitch:35,label:`Верх ${i+1}/8`});for(let i=0;i<8;i++)T.push({yaw:i*45,pitch:-35,label:`Низ ${i+1}/8`});T.push({yaw:0,pitch:75,label:'Зенит 1/2',vertical:true},{yaw:180,pitch:75,label:'Зенит 2/2',vertical:true},{yaw:0,pitch:-75,label:'Надир 1/2',vertical:true},{yaw:180,pitch:-75,label:'Надир 2/2',vertical:true});function save(){localStorage.setItem(KEY,JSON.stringify(s))}function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('on'));$(id).classList.add('on')}function pad(n){return String(n).padStart(2,'0')}function norm(a){return(a%360+360)%360}function diff(a,b){let d=norm(a)-norm(b);if(d>180)d-=360;if(d<-180)d+=360;return d}function mixAngle(prev,next,a=.18){if(prev===null)return next;return norm(prev+diff(next,prev)*a)}function mb(n){return(n/1024/1024).toFixed(2)+' MB'}function compat(){$('compat').textContent=`HTTPS ${location.protocol==='https:'?'✓':'✕'} · Camera ${navigator.mediaDevices?.getUserMedia?'✓':'✕'} · Full Photo API ${'ImageCapture' in window?'✓':'—'} · задержка ${AUTO_HOLD_MS} мс`}$('new').onclick=()=>show('obj');$('back').onclick=()=>show('home');document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{document.querySelectorAll('.mode').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');s.mode=b.dataset.mode;$('create').disabled=false});$('create').onclick=()=>{s.objectName=$('objName').value.trim()||`Объект ${new Date().toLocaleDateString()}`;s.station=1;s.current=0;save();openStation()};function openStation(){$('stTitle').textContent=`Станция ${pad(s.station)}`;$('stObj').textContent=s.objectName;$('stName').value='';compat();show('station')}async function cam(){const tries=[{video:{facingMode:{ideal:'environment'},width:{ideal:3840},height:{ideal:2160},frameRate:{ideal:15,max:30}},audio:false},{video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080},frameRate:{ideal:30,max:30}},audio:false},{video:{facingMode:{ideal:'environment'}},audio:false},{video:true,audio:false}];let err=null;for(const c of tries){try{return await navigator.mediaDevices.getUserMedia(c)}catch(e){err=e}}throw err||new Error('camera')}async function tuneTrack(){if(!track)return;try{const caps=track.getCapabilities?track.getCapabilities():{};const req={};if(caps.width?.max)req.width={ideal:Math.min(caps.width.max,3840)};if(caps.height?.max)req.height={ideal:Math.min(caps.height.max,2160)};const adv={};if(Array.isArray(caps.focusMode)&&caps.focusMode.includes('continuous'))adv.focusMode='continuous';if(Array.isArray(caps.exposureMode)&&caps.exposureMode.includes('continuous'))adv.exposureMode='continuous';if(Object.keys(adv).length)req.advanced=[adv];if(Object.keys(req).length)await track.applyConstraints(req)}catch(e){}}async function preparePhotoCapture(){photoCapture=null;photoCaps=null;if(!track||!('ImageCapture'in window))return;try{photoCapture=new ImageCapture(track);photoCaps=await photoCapture.getPhotoCapabilities()}catch(e){try{photoCapture=new ImageCapture(track)}catch(e2){photoCapture=null}}}async function orientPermission(){if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function')try{await DeviceOrientationEvent.requestPermission()}catch(e){}}$('start').onclick=async()=>{try{await orientPermission();stream=await cam();track=stream.getVideoTracks()[0]||null;await tuneTrack();await preparePhotoCapture();$('v').srcObject=stream;await $('v').play();started=true;baseYaw=null;smoothYaw=null;smoothPitch=null;document.querySelectorAll('.screen').forEach(x=>x.classList.remove('on'));$('capture').classList.add('on');$('actions').classList.add('on');$('op').textContent=s.objectName;$('sp').textContent=`Станция ${pad(s.station)}`;render();const set=track?.getSettings?.()||{};$('status').classList.remove('warn');$('status').textContent=`Наведение ${set.width||$('v').videoWidth}×${set.height||$('v').videoHeight} · full photo ${photoCapture?'✓':'fallback'}` }catch(e){$('status').textContent='Камера не открылась: '+(e.name||'')+' '+(e.message||e)}};function render(){$('count').textContent=`${s.current} / ${T.length}`;latched=false;latchAt=0;shooting=false;const t=T[s.current];if(!t){$('g1').textContent='Станция готова ✓';$('g2').textContent='Нажмите «Завершить станцию»';$('arrow').textContent='✓';$('target').classList.add('good');return}$('target').classList.remove('good');$('g1').textContent=t.label;$('g2').textContent=`Кадр ${s.current+1} из ${T.length}`;$('arrow').textContent=''}async function dbPut(key,blob,meta){return new Promise((res,rej)=>{const q=indexedDB.open('lunaru_capture_media_v1',1);q.onupgradeneeded=()=>q.result.createObjectStore('frames');q.onerror=()=>rej(q.error);q.onsuccess=()=>{const db=q.result,tx=db.transaction('frames','readwrite');tx.objectStore('frames').put({blob,...meta},key);tx.oncomplete=()=>{db.close();res()};tx.onerror=()=>rej(tx.error)}})}async function captureBlob(){if(photoCapture){try{const opts={};if(photoCaps?.imageWidth?.max)opts.imageWidth=photoCaps.imageWidth.max;if(photoCaps?.imageHeight?.max)opts.imageHeight=photoCaps.imageHeight.max;let b=null;try{b=await photoCapture.takePhoto(opts)}catch(e){b=await photoCapture.takePhoto()}if(b&&b.size>0)return{blob:b,method:'ImageCapture.takePhoto()'}}catch(e){}}const v=$('v'),c=$('c');c.width=v.videoWidth||1280;c.height=v.videoHeight||720;c.getContext('2d').drawImage(v,0,0,c.width,c.height);const b=await new Promise(r=>c.toBlob(r,'image/jpeg',.99));return{blob:b,method:'canvas fallback'}}async function imageSize(blob){try{const bm=await createImageBitmap(blob);const r={width:bm.width,height:bm.height};bm.close();return r}catch(e){return{width:0,height:0}}}async function shoot(auto){if(shooting||!started||!T[s.current])return;shooting=true;$('g2').textContent=auto?'Фиксирую полноразмерный кадр…':'Сохраняю…';const {blob,method}=await captureBlob();const dims=blob?await imageSize(blob):{width:0,height:0};const n=s.current+1,key=`${s.objectName}__S${pad(s.station)}__${pad(n)}`;if(blob)try{await dbPut(key,blob,{objectName:s.objectName,station:s.station,frame:n,target:T[s.current],angles:last,auto,captureMethod:method,width:dims.width,height:dims.height,bytes:blob.size,savedAt:new Date().toISOString()})}catch(e){}s.current++;save();$('flash').classList.remove('f');void $('flash').offsetWidth;$('flash').classList.add('f');const pixels=dims.width*dims.height,low=pixels<2000000||blob.size<250000||method==='canvas fallback';$('status').classList.toggle('warn',low);$('status').textContent=`Кадр ${s.current}: ${dims.width||'?'}×${dims.height||'?'} · ${mb(blob?.size||0)} · ${method}${low?' ⚠️':''}`;render()}window.addEventListener('deviceorientation',e=>{if(!started)return;const t=T[s.current];if(!t)return;const rawYaw=norm(e.webkitCompassHeading??(360-(e.alpha||0))),rawPitch=Math.max(-90,Math.min(90,(Number.isFinite(e.beta)?e.beta:90)-90));smoothYaw=mixAngle(smoothYaw,rawYaw,.16);smoothPitch=smoothPitch===null?rawPitch:smoothPitch+(rawPitch-smoothPitch)*.22;const yaw=smoothYaw,pitch=smoothPitch;last={yaw,pitch};let dy=0,dp=pitch-t.pitch,enter=false,keep=false;if(t.vertical){enter=Math.abs(dp)<18;keep=Math.abs(dp)<25}else{if(baseYaw===null&&Math.abs(pitch)<22)baseYaw=yaw;const ty=baseYaw===null?yaw:norm(baseYaw+t.yaw);dy=diff(yaw,ty);enter=Math.abs(dy)<18&&Math.abs(dp)<15;keep=Math.abs(dy)<28&&Math.abs(dp)<22}if(!latched&&enter){latched=true;latchAt=performance.now()}if(latched&&!keep){latched=false;latchAt=0}if(latched){$('target').classList.add('good');$('arrow').textContent='✓';$('g1').textContent='Цель поймана';$('g2').textContent=performance.now()-latchAt>AUTO_HOLD_MS-180?'Стабилизация камеры…':'Держите неподвижно';if(performance.now()-latchAt>AUTO_HOLD_MS)shoot(true)}else{$('target').classList.remove('good');if(t.vertical)$('arrow').textContent=dp<0?'↑':'↓';else if(Math.abs(dp)>15)$('arrow').textContent=dp<0?'↑':'↓';else $('arrow').textContent=dy<0?'→':'←'}},true);$('manual').onclick=()=>shoot(false);$('retake').onclick=()=>{if(s.current>0){s.current--;save();render();$('status').classList.remove('warn');$('status').textContent=`Переснятие кадра ${s.current+1}`}};function stop(){started=false;if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;track=null;photoCapture=null;photoCaps=null;$('capture').classList.remove('on');$('actions').classList.remove('on')}$('finishSt').onclick=()=>{stop();s.station++;s.current=0;save();openStation();$('status').textContent=`Станция ${pad(s.station)} готова`};$('modeBtn').onclick=()=>{stop();show('obj')};$('finishObj').onclick=()=>{s={station:1,objectName:'',mode:'',current:0};save();show('home');$('status').textContent='Объект завершён'};</script></body></html>
