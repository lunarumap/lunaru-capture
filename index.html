<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>LUNARU Capture</title><style>:root{--b:#05090d;--p:#0f1821;--l:#294052;--t:#f4f7fa;--m:#a9b7c3;--a:#49b8ff;--g:#59e39a}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--b);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}button,input{font:inherit}#app{height:100%;display:grid;grid-template-rows:auto 1fr auto}header{display:flex;gap:10px;align-items:center;padding:11px 13px;background:#0b1218;border-bottom:1px solid #1d2c37}.logo{width:36px;height:36px;border-radius:10px;background:var(--a);color:#031018;display:grid;place-items:center;font-weight:900}.brand b{display:block}.brand span{display:block;color:var(--m);font-size:11px}main{position:relative;min-height:0;background:#000}video{width:100%;height:100%;object-fit:cover}.screen{position:absolute;inset:0;display:none;place-items:center;padding:18px;background:linear-gradient(180deg,#08111a,#0c1822)}.screen.on{display:grid}.card{width:min(500px,100%);background:var(--p);border:1px solid var(--l);border-radius:18px;padding:18px}.card h1,.card h2{margin:0 0 10px}.card p{color:var(--m);font-size:13px}.field{margin:10px 0}.field label{display:block;color:var(--m);font-size:11px;margin-bottom:5px}.field input{width:100%;padding:12px;border-radius:11px;border:1px solid var(--l);background:#0b141d;color:#fff}.btn{width:100%;padding:13px;border-radius:12px;border:0;background:var(--a);color:#031018;font-weight:900;margin-top:9px}.alt{background:#14222d;color:#fff;border:1px solid var(--l)}.mode{width:100%;text-align:left;padding:12px;border-radius:12px;border:1px solid var(--l);background:#13212d;color:#fff;margin-top:8px}.mode.sel{outline:2px solid var(--a)}.mode span{display:block;color:var(--m);font-size:11px;margin-top:3px}#capture{display:none;position:absolute;inset:0;pointer-events:none}#capture.on{display:block}.top{position:absolute;top:12px;left:12px;right:12px;display:grid;grid-template-columns:1fr auto 1fr;gap:8px}.pill{background:rgba(7,12,17,.84);border:1px solid #33516a;border-radius:10px;padding:8px 10px;font-size:12px}.center{text-align:center}.right{text-align:right}.target{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:145px;height:145px;border:4px solid #fff;border-radius:50%}.target.good{border-color:var(--g);box-shadow:0 0 0 5px rgba(89,227,154,.2)}#arrow{position:absolute;left:50%;top:37%;transform:translate(-50%,-50%);font-size:52px;font-weight:900;text-shadow:0 2px 10px #000}.guide{position:absolute;left:12px;right:12px;bottom:18px;background:rgba(7,12,17,.86);border:1px solid #33516a;border-radius:14px;padding:11px;text-align:center}.guide b{font-size:18px}.guide span{display:block;color:var(--m);font-size:12px;margin-top:4px}footer{padding:9px 10px calc(9px + env(safe-area-inset-bottom));background:#0b1218;border-top:1px solid #1d2c37}.actions{display:none;grid-template-columns:1fr 1fr;gap:7px}.actions.on{display:grid}.actions button{padding:10px 7px;border-radius:10px;border:1px solid #2c4357;background:#152431;color:#fff;font-weight:800}.status{font-size:11px;color:var(--m);text-align:center;margin-top:6px;min-height:14px}#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}#flash.f{animation:f .2s}@keyframes f{30%{opacity:.8}100%{opacity:0}}</style></head><body><div id="app"><header><div class="logo">L</div><div class="brand"><b>LUNARU Capture</b><span>Съёмка панорамы 360° · HTTPS</span></div></header><main><video id="v" playsinline autoplay muted></video><canvas id="c" hidden></canvas><section id="home" class="screen on"><div class="card"><h1>LUNARU Capture</h1><p>Объект → станция → 32 кадра → следующая станция.</p><button id="new" class="btn">НОВЫЙ ОБЪЕКТ</button></div></section><section id="obj" class="screen"><div class="card"><h2>Новый объект</h2><div class="field"><label>Название объекта</label><input id="objName" placeholder="Можно оставить пустым"></div><button class="mode" data-mode="outdoor-gps"><b>Улица · GPS</b><span>Координаты сохраняются при наличии</span></button><button class="mode" data-mode="outdoor-no-gps"><b>Улица · без GPS</b><span>Координаты не обязательны</span></button><button class="mode" data-mode="indoor"><b>Помещение</b><span>GPS не требуется</span></button><button id="create" class="btn" disabled>НАЧАТЬ ОБЪЕКТ</button><button id="back" class="btn alt">НАЗАД</button></div></section><section id="station" class="screen"><div class="card"><h2 id="stTitle">Станция 01</h2><p id="stObj"></p><div class="field"><label>Название станции</label><input id="stName" placeholder="Например: Кухня"></div><p id="compat">Проверка камеры…</p><button id="start" class="btn">НАЧАТЬ СЪЁМКУ</button><button id="finishObj" class="btn alt">ЗАВЕРШИТЬ ОБЪЕКТ</button></div></section><div id="capture"><div class="top"><div id="op" class="pill">Объект</div><div id="sp" class="pill center">Станция 01</div><div id="count" class="pill right">0 / 32</div></div><div id="target" class="target"></div><div id="arrow"></div><div class="guide"><b id="g1">Держите телефон вертикально</b><span id="g2">Первое направление станет началом станции</span></div></div><div id="flash"></div></main><footer><div id="actions" class="actions"><button id="retake">Переснять</button><button id="manual">Снять вручную</button><button id="finishSt">Завершить станцию</button><button id="modeBtn">Режим</button></div><div id="status" class="status">Готово</div></footer></div><script>"use strict";const $=x=>document.getElementById(x);const KEY='lunaru_capture_https_v1';let state=JSON.parse(localStorage.getItem(KEY)||'null')||{station:1,objectName:'',mode:'',current:0,shots:[]};let stream=null,started=false,baseYaw=null,stable=0,lock=false,last={yaw:0,pitch:0},goodLatched=false,badSince=0;const targets=[];for(let i=0;i<12;i++)targets.push({yaw:i*30,pitch:0,label:`Горизонт ${i+1}/12`});for(let i=0;i<8;i++)targets.push({yaw:i*45,pitch:35,label:`Верх ${i+1}/8`});for(let i=0;i<8;i++)targets.push({yaw:i*45,pitch:-35,label:`Низ ${i+1}/8`});targets.push({yaw:0,pitch:75,label:'Зенит 1/2',vertical:true},{yaw:180,pitch:75,label:'Зенит 2/2',vertical:true},{yaw:0,pitch:-75,label:'Надир 1/2',vertical:true},{yaw:180,pitch:-75,label:'Надир 2/2',vertical:true});function save(){localStorage.setItem(KEY,JSON.stringify(state))}function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));$(id).classList.add('on')}function pad(n){return String(n).padStart(2,'0')}function norm(a){return(a%360+360)%360}function diff(a,b){let d=norm(a)-norm(b);if(d>180)d-=360;if(d<-180)d+=360;return d}function compat(){const ok=!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia);$('compat').textContent=`HTTPS ${location.protocol==='https:'?'✓':'✕'} · Camera API ${ok?'✓':'✕'}`}$('new').onclick=()=>show('obj');$('back').onclick=()=>show('home');document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{document.querySelectorAll('.mode').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');state.mode=b.dataset.mode;$('create').disabled=false});$('create').onclick=()=>{state.objectName=$('objName').value.trim()||`Объект ${new Date().toLocaleDateString()}`;state.station=1;state.current=0;state.shots=[];save();openStation()};function openStation(){$('stTitle').textContent=`Станция ${pad(state.station)}`;$('stObj').textContent=state.objectName;$('stName').value='';compat();show('station')};async function cam(){if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia))throw Error('Camera API недоступен');try{return await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false})}catch(e){return await navigator.mediaDevices.getUserMedia({video:true,audio:false})}}async function orientPermission(){if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){try{await DeviceOrientationEvent.requestPermission()}catch(e){}}}$('start').onclick=async()=>{try{$('status').textContent='Открываю камеру…';await orientPermission();stream=await cam();$('v').srcObject=stream;await $('v').play();started=true;baseYaw=null;state.current=state.current||0;document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));$('capture').classList.add('on');$('actions').classList.add('on');$('op').textContent=state.objectName;$('sp').textContent=`Станция ${pad(state.station)}`;render();$('status').textContent='Камера открыта ✓'}catch(e){$('status').textContent='Камера не открылась: '+(e.name||'')+' '+(e.message||e)}};function render(){$('count').textContent=`${state.current} / ${targets.length}`;const t=targets[state.current];if(!t){$('g1').textContent='Станция готова ✓';$('g2').textContent='Нажмите «Завершить станцию»';$('arrow').textContent='✓';$('target').classList.add('good');return}$('target').classList.remove('good');$('g1').textContent=t.label;$('g2').textContent=`Кадр ${state.current+1} из ${targets.length}`;$('arrow').textContent='';stable=0;lock=false;goodLatched=false;badSince=0}async function shoot(auto){if(!started||!targets[state.current])return;const v=$('v'),c=$('c');c.width=v.videoWidth||1280;c.height=v.videoHeight||720;c.getContext('2d').drawImage(v,0,0,c.width,c.height);const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.9));if(!blob)return;state.shots[state.current]={time:new Date().toISOString(),target:targets[state.current],angles:last,auto,size:blob.size};state.current++;save();$('flash').classList.remove('f');void $('flash').offsetWidth;$('flash').classList.add('f');$('status').textContent=`Кадр ${state.current} сохранён${auto?' автоматически':''}`;render()}window.addEventListener('deviceorientation',e=>{if(!started)return;const t=targets[state.current];if(!t)return;const now=performance.now();const yaw=norm(e.webkitCompassHeading??(360-(e.alpha||0)));const beta=Number.isFinite(e.beta)?e.beta:90;const pitch=Math.max(-90,Math.min(90,beta-90));last={yaw,pitch};let enter=false,keep=false,dy=0,dp=pitch-t.pitch;if(t.vertical){enter=Math.abs(dp)<14;keep=Math.abs(dp)<18;$('arrow').textContent=(goodLatched?keep:enter)?'✓':(dp<0?'↑':'↓')}else{if(baseYaw===null&&Math.abs(pitch)<18)baseYaw=yaw;const ty=baseYaw===null?yaw:norm(baseYaw+t.yaw);dy=diff(yaw,ty);enter=Math.abs(dy)<12&&Math.abs(dp)<12;keep=Math.abs(dy)<16&&Math.abs(dp)<16;if(!(goodLatched?keep:enter))$('arrow').textContent=Math.abs(dp)>=12?(dp<0?'↑':'↓'):(dy<0?'→':'←');else $('arrow').textContent='✓'}let good=goodLatched?keep:enter;if(good){goodLatched=true;badSince=0;$('target').classList.add('good');$('g1').textContent='Держите неподвижно…';$('g2').textContent='Снимаю автоматически';if(!stable)stable=now;if(now-stable>450&&!lock){lock=true;shoot(true)}}else if(goodLatched){if(!badSince)badSince=now;if(now-badSince<250){good=true;$('target').classList.add('good');$('arrow').textContent='✓';$('g1').textContent='Держите неподвижно…';$('g2').textContent='Снимаю автоматически';if(!stable)stable=now;if(now-stable>450&&!lock){lock=true;shoot(true)}}else{goodLatched=false;badSince=0;stable=0;lock=false;$('target').classList.remove('good')}}else{stable=0;lock=false;$('target').classList.remove('good')}},true);$('manual').onclick=()=>shoot(false);$('retake').onclick=()=>{if(state.current>0){state.current--;state.shots=state.shots.slice(0,state.current);save();render();$('status').textContent=`Переснятие кадра ${state.current+1}`}};function stop(){started=false;if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;$('capture').classList.remove('on');$('actions').classList.remove('on')}$('finishSt').onclick=()=>{stop();state.station++;state.current=0;state.shots=[];save();openStation();$('status').textContent=`Станция ${pad(state.station)} готова`};$('modeBtn').onclick=()=>{stop();show('obj')};$('finishObj').onclick=()=>{state={station:1,objectName:'',mode:'',current:0,shots:[]};save();show('home');$('status').textContent='Объект завершён'};</script></body></html>
