<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>LUNARU Capture · Quality Test</title><style>body{margin:0;background:#071018;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.wrap{max-width:720px;margin:auto;padding:18px}h1{margin:0 0 8px}p{color:#a9b7c3}.card{background:#0f1821;border:1px solid #294052;border-radius:16px;padding:14px;margin:12px 0}video,img{width:100%;border-radius:14px;background:#000;display:block}button,.filebtn{width:100%;padding:14px;margin-top:10px;border:0;border-radius:12px;background:#49b8ff;color:#031018;font-weight:800;font-size:16px;display:block;text-align:center;box-sizing:border-box}.alt{background:#152431;color:#fff;border:1px solid #294052}.native{background:#59e39a}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;white-space:pre-wrap;color:#d7e2ea}.ok{color:#59e39a}.warn{color:#ffcf66}input[type=file]{position:absolute;left:-9999px}</style></head><body><div class="wrap"><h1>LUNARU Capture</h1><p>Тест качества фото · iPhone / Android</p><div class="card"><div id="status" class="mono">Выбери способ съёмки ниже.</div></div><label class="filebtn native" for="nativeFile">1. СНЯТЬ ЧЕРЕЗ ШТАТНУЮ КАМЕРУ</label><input id="nativeFile" type="file" accept="image/*" capture="environment"><button id="open">2. ОТКРЫТЬ WEB-КАМЕРУ</button><video id="v" playsinline autoplay muted></video><button id="shot" class="alt">СНЯТЬ ИЗ WEB-ПОТОКА</button><button id="save" class="alt" disabled>СОХРАНИТЬ ТЕКУЩИЙ ФАЙЛ</button><div class="card"><div id="result" class="mono">Результат появится здесь</div></div><img id="preview" alt=""></div><script>let stream=null,track=null,lastBlob=null,lastUrl=null;const $=id=>document.getElementById(id);const mb=n=>(n/1024/1024).toFixed(2)+' MB';const isiOS=/iPhone|iPad|iPod/i.test(navigator.userAgent);async function dims(blob){try{const b=await createImageBitmap(blob);const r=[b.width,b.height];b.close();return r}catch(e){return[0,0]}}function setPreview(blob){if(lastUrl)URL.revokeObjectURL(lastUrl);lastUrl=URL.createObjectURL(blob);$('preview').src=lastUrl;$('save').disabled=false}async function showBlob(blob,method){lastBlob=blob;const [w,h]=await dims(blob);setPreview(blob);$('result').innerHTML='<span class="ok">ГОТОВО</span>\nМетод: '+method+'\nРазрешение: '+w+'×'+h+'\nРазмер: '+mb(blob.size)+' ('+Math.round(blob.size/1024)+' KB)\nТип: '+(blob.type||'неизвестно');}async function openCam(){try{if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;track=null;$('status').textContent='Запрашиваю максимальный web-поток…';const tries=[{video:{facingMode:{ideal:'environment'},width:{ideal:3840},height:{ideal:2160},frameRate:{ideal:15,max:30}},audio:false},{video:{facingMode:{ideal:'environment'},width:{ideal:2560},height:{ideal:1440}},audio:false},{video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false},{video:{facingMode:{ideal:'environment'}},audio:false}];let err=null;for(const c of tries){try{stream=await navigator.mediaDevices.getUserMedia(c);break}catch(e){err=e}}if(!stream)throw err||new Error('camera');track=stream.getVideoTracks()[0];$('v').srcObject=stream;await $('v').play();const s=track.getSettings?.()||{};$('status').textContent='WEB-поток: '+(s.width||$('v').videoWidth)+'×'+(s.height||$('v').videoHeight)+'\nImageCapture: '+((!isiOS&&'ImageCapture'in window)?'есть':'нет/отключён на iPhone')+'\nМожно снимать несколько раз подряд.';}catch(e){$('status').textContent='Ошибка камеры: '+e.name+' '+e.message;}}async function takeWeb(){try{if(!track)await openCam();if(!track)throw new Error('Камера не открыта');$('result').textContent='Снимаю из web-потока…';await new Promise(r=>setTimeout(r,500));let blob=null,method='';if(!isiOS&&'ImageCapture'in window){try{const ic=new ImageCapture(track);blob=await ic.takePhoto();if(blob?.size)method='ImageCapture.takePhoto()'}catch(e){blob=null}}if(!blob){const v=$('v'),c=document.createElement('canvas');c.width=v.videoWidth||1920;c.height=v.videoHeight||1080;c.getContext('2d').drawImage(v,0,0,c.width,c.height);blob=await new Promise(r=>c.toBlob(r,'image/jpeg',0.98));method='canvas из web-потока'}await showBlob(blob,method);}catch(e){$('result').textContent='Ошибка: '+e.name+' '+e.message;}}$('nativeFile').addEventListener('change',async e=>{try{const f=e.target.files?.[0];if(!f)return;$('status').innerHTML='<span class="warn">Получен файл из штатной камеры</span>';await showBlob(f,'штатная камера телефона (file capture)');e.target.value='';}catch(err){$('result').textContent='Ошибка файла: '+err.name+' '+err.message;}});$('open').onclick=openCam;$('shot').onclick=takeWeb;$('save').onclick=()=>{if(!lastBlob)return;const a=document.createElement('a');const u=URL.createObjectURL(lastBlob);a.href=u;a.download='LUNARU_quality_'+Date.now()+'.jpg';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},1500)};</script></body></html>
