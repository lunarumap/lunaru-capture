<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>LUNARU Capture · Quality Test</title><style>body{margin:0;background:#071018;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.wrap{max-width:720px;margin:auto;padding:18px}h1{margin:0 0 8px}p{color:#a9b7c3}.card{background:#0f1821;border:1px solid #294052;border-radius:16px;padding:14px;margin:12px 0}video,img{width:100%;border-radius:14px;background:#000;display:block}button{width:100%;padding:14px;margin-top:10px;border:0;border-radius:12px;background:#49b8ff;color:#031018;font-weight:800;font-size:16px}.alt{background:#152431;color:#fff;border:1px solid #294052}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;white-space:pre-wrap;color:#d7e2ea}.ok{color:#59e39a}</style></head><body><div class="wrap"><h1>LUNARU Capture</h1><p>Тест максимального качества фото</p><div class="card"><div id="status" class="mono">Камера не открыта</div></div><video id="v" playsinline autoplay muted></video><button id="open">ОТКРЫТЬ КАМЕРУ</button><button id="shot">СНЯТЬ МАКСИМАЛЬНОЕ ФОТО</button><button id="save" class="alt" disabled>СКАЧАТЬ JPEG</button><div class="card"><div id="result" class="mono">Результат появится здесь</div></div><img id="preview" alt=""></div><script>let stream=null,track=null,lastBlob=null;const $=id=>document.getElementById(id);const mb=n=>(n/1024/1024).toFixed(2)+' MB';async function dims(blob){try{const b=await createImageBitmap(blob);const r=[b.width,b.height];b.close();return r}catch(e){return[0,0]}}async function openCam(){if(stream)stream.getTracks().forEach(t=>t.stop());$('status').textContent='Запрашиваю максимальный видеопоток…';const tries=[{video:{facingMode:{ideal:'environment'},width:{ideal:3840},height:{ideal:2160},frameRate:{ideal:15,max:30}},audio:false},{video:{facingMode:{ideal:'environment'},width:{ideal:2560},height:{ideal:1920}},audio:false},{video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false},{video:{facingMode:{ideal:'environment'}},audio:false}];let err=null;for(const c of tries){try{stream=await navigator.mediaDevices.getUserMedia(c);break}catch(e){err=e}}if(!stream)throw err||new Error('camera');track=stream.getVideoTracks()[0];try{const caps=track.getCapabilities?.()||{};const req={};if(caps.width?.max)req.width={ideal:Math.min(caps.width.max,3840)};if(caps.height?.max)req.height={ideal:Math.min(caps.height.max,2160)};const adv={};if(Array.isArray(caps.focusMode)&&caps.focusMode.includes('continuous'))adv.focusMode='continuous';if(Array.isArray(caps.exposureMode)&&caps.exposureMode.includes('continuous'))adv.exposureMode='continuous';if(Object.keys(adv).length)req.advanced=[adv];if(Object.keys(req).length)await track.applyConstraints(req)}catch(e){}$('v').srcObject=stream;await $('v').play();const s=track.getSettings?.()||{};$('status').textContent='Поток: '+(s.width||$('v').videoWidth)+'×'+(s.height||$('v').videoHeight)+'\nImageCapture: '+(('ImageCapture'in window)?'есть':'нет')+'\nUA: '+navigator.userAgent}async function take(){if(!track)await openCam();$('result').textContent='Снимаю…';let blob=null,method='';if('ImageCapture'in window){try{const ic=new ImageCapture(track);let opts={};try{const pc=await ic.getPhotoCapabilities();if(pc.imageWidth?.max)opts.imageWidth=pc.imageWidth.max;if(pc.imageHeight?.max)opts.imageHeight=pc.imageHeight.max}catch(e){}try{blob=await ic.takePhoto(opts)}catch(e){blob=await ic.takePhoto()}if(blob?.size)method='ImageCapture.takePhoto()'}catch(e){}}if(!blob){const v=$('v'),c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);blob=await new Promise(r=>c.toBlob(r,'image/jpeg',0.99));method='canvas fallback'}lastBlob=blob;const [w,h]=await dims(blob);$('preview').src=URL.createObjectURL(blob);$('save').disabled=false;$('result').innerHTML='<span class="ok">ГОТОВО</span>\nМетод: '+method+'\nРазрешение: '+w+'×'+h+'\nРазмер: '+mb(blob.size)+' ('+Math.round(blob.size/1024)+' KB)\nТип: '+blob.type} $('open').onclick=()=>openCam().catch(e=>$('status').textContent='Ошибка: '+e.name+' '+e.message);$('shot').onclick=()=>take().catch(e=>$('result').textContent='Ошибка: '+e.name+' '+e.message);$('save').onclick=()=>{if(!lastBlob)return;const a=document.createElement('a');a.href=URL.createObjectURL(lastBlob);a.download='LUNARU_quality_test_'+Date.now()+'.jpg';a.click()};</script></body></html>
